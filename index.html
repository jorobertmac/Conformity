<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conformity</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="ui">
    <div id="stats">
      <span id="player-identity">Identity: —</span>
      <span id="player-conviction">Conviction: —</span>
      <span id="dode-count">Dodes: 16</span>
      <span id="time">Time: 0s</span>
      <span id="target-pct">Target: —</span>
    </div>
    <div id="legend"></div>
  </div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1>Conformity</h1>
    <p>Click to move your Dode. Bump others.<br>
       Win by making your Identity reach the target share of all Dodes.</p>
    <p class="difficulty-label">Choose difficulty</p>
    <div id="difficulty-buttons">
      <button data-difficulty="Easy">Easy · 33%</button>
      <button data-difficulty="Medium">Medium · 50%</button>
      <button data-difficulty="Hard">Hard · 67%</button>
      <button data-difficulty="Extreme">Extreme · 100%</button>
    </div>
  </div>
  <div id="end-screen" class="hidden">
    <h1 id="end-title">Game Over</h1>
    <p id="end-message"></p>
    <button id="restart-btn">Play Again</button>
  </div>
</body>
</html>
