<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conformity</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="ui">
    <div id="stats">
      <span id="player-identity">Identity: —</span>
      <span id="player-conviction">Conviction: —</span>
      <span id="dode-count">Dodes: 32</span>
      <span id="time">Time: 0s</span>
    </div>
    <div id="legend"></div>
  </div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1>Conformity</h1>
    <p>Click anywhere to move your Dode.<br>Bump others. Become the dominant color.</p>
    <button id="start-btn">Begin</button>
  </div>
  <div id="end-screen" class="hidden">
    <h1 id="end-title">Game Over</h1>
    <p id="end-message"></p>
    <button id="restart-btn">Play Again</button>
  </div>
</body>
</html>
